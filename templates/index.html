<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystická Svatyně - Ezoterické Služby</title>
    <style>
        body {
            background-color: #0a0512;
            color: #f3e8ff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2 {
            color: #d4af37;
            text-align: center;
        }
        .card-box, .service-card, .form-card {
            background-color: #170d2b;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        button {
            background-color: #d4af37;
            color: #0a0512;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #f3c846;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #d4af37;
            background-color: #0a0512;
            color: #fff;
            box-sizing: border-box;
        }
        .qr-result {
            text-align: center;
            margin-top: 15px;
        }
        .qr-result img {
            max-width: 200px;
            border: 2px solid #d4af37;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Mystická Svatyně ✨</h1>

        <!-- KARTY -->
        <div class="card-box">
            <h2>Denní karta Tarotu</h2>
            <div id="card-display">Klikněte pro vytažení karty...</div>
            <button onclick="drawCard()">Táhnout kartu</button>
        </div>

        <!-- CENÍK A SLUŽBY -->
        <h2>Naše Služby</h2>
        {% for key, service in services.items() %}
        <div class="service-card">
            <h3>{{ service.title }} - {{ service.price }} {{ service.currency }}</h3>
            <p>{{ service.description }}</p>
            <button onclick="generateQR('{{ key }}')">Zobrazit QR kód k platbě</button>
        </div>
        {% endfor %}

        <!-- QR KÓD DISPLAY -->
        <div id="qr-container" class="form-card" style="display: none;">
            <h2>Platba SEPA QR</h2>
            <div class="qr-result" id="qr-content"></div>
        </div>

        <!-- REZERVAČNÍ FORMULÁŘ -->
        <div class="form-card">
            <h2>Rezervace Služby</h2>
            <form id="reservation-form">
                <label for="res-email">Váš E-mail:</label>
                <input type="email" id="res-email" required placeholder="zadejte@email.cz">

                <label for="res-service">Vyberte službu:</label>
                <select id="res-service">
                    {% for key, service in services.items() %}
                    <option value="{{ key }}">{{ service.title }} ({{ service.price }} EUR)</option>
                    {% endfor %}
                </select>

                <label for="res-note">Poznámka / Dotaz:</label>
                <textarea id="res-note" rows="3" placeholder="Upřesněte váš dotaz..."></textarea>

                <button type="submit" id="res-submit-btn">Odeslat rezervaci</button>
            </form>
        </div>
    </div>

    <script>
        // Tažení karty
        async function drawCard() {
            const res = await fetch('/api/draw-card');
            const data = await res.json();
            document.getElementById('card-display').innerHTML = `<strong>${data.name}</strong>: ${data.meaning}`;
        }

        // Generování QR
        async function generateQR(serviceId) {
            const res = await fetch('/api/generate-qr', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ service_id: serviceId })
            });
            const data = await res.json();
            const qrContainer = document.getElementById('qr-container');
            const qrContent = document.getElementById('qr-content');
            
            qrContent.innerHTML = `
                <p><strong>${data.title}</strong> - ${data.price}</p>
                <img src="${data.qr_image}" alt="QR Kód">
                <p>IBAN: ${data.iban}<br>Variabilní symbol: ${data.vs}</p>
            `;
            qrContainer.style.display = 'block';
            qrContainer.scrollIntoView({ behavior: 'smooth' });
        }

        // Odeslání formuláře rezervace
        document.getElementById('reservation-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('res-email').value;
            const service = document.getElementById('res-service').value;
            const note = document.getElementById('res-note').value;
            const btn = document.getElementById('res-submit-btn');

            btn.disabled = true;
            btn.innerText = "Odesílám rezervaci...";

            try {
                const response = await fetch('/api/reserve', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, service: service, note: note })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    alert(data.message);
                    document.getElementById('reservation-form').reset();
                } else {
                    alert("Chyba: " + (data.message || "Nepodařilo se odeslat."));
                }
            } catch (err) {
                alert("Chyba při komunikaci se serverem.");
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "Odeslat rezervaci";
            }
        });
    </script>
</body>
</html>
