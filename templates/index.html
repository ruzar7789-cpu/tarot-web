<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystická Svatyně | Výklad Tarotu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07030d;
            --card-bg: #12091f;
            --accent-gold: #d4af37;
            --text-light: #e0d6eb;
            --border-gold: rgba(212, 175, 55, 0.4);
        }
        body { background: var(--bg-color); color: var(--text-light); font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        header { background: linear-gradient(180deg, #1b0a2e 0%, var(--bg-color) 100%); padding: 40px 20px; text-align: center; border-bottom: 1px solid var(--border-gold); }
        h1, h2, h3 { font-family: 'Cinzel', serif; color: var(--accent-gold); letter-spacing: 2px; }
        .container { max-width: 900px; margin: auto; padding: 20px; }
        .card-container { display: flex; justify-content: center; gap: 20px; margin: 30px 0; perspective: 1000px; }
        .tarot-card { width: 140px; height: 220px; position: relative; transform-style: preserve-3d; transition: transform 0.8s ease; cursor: pointer; }
        .tarot-card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; border: 2px solid var(--accent-gold); display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; box-sizing: border-box; }
        .card-back { background: linear-gradient(135deg, #2b0845, #0d0118); color: var(--accent-gold); font-size: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card-front { background: #1a0c2e; transform: rotateY(180deg); flex-direction: column; justify-content: space-around; box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        .card-title { font-family: 'Cinzel', serif; color: var(--accent-gold); font-weight: bold; font-size: 1.1rem; }
        .card-meaning { font-size: 0.8rem; line-height: 1.3; }
        button { background: linear-gradient(45deg, #4a0080, #7b00d8); color: var(--accent-gold); border: 1px solid var(--accent-gold); padding: 12px 28px; border-radius: 25px; cursor: pointer; font-family: 'Cinzel', serif; font-size: 1rem; transition: 0.3s; box-shadow: 0 0 10px rgba(123,0,216,0.5); }
        button:hover { background: var(--accent-gold); color: #000; box-shadow: 0 0 15px var(--accent-gold); }
        .section-box { background: var(--card-bg); border: 1px solid var(--border-gold); border-radius: 12px; padding: 25px; margin-bottom: 30px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>✨ MYSTICKÁ SVATYNĚ ✨</h1>
        <p>Portál Ezoteriky, Rituálů a Astrálního Poznání</p>
    </header>
    <div class="container">
        <div class="section-box">
            <h2>🔮 Interaktivní Výklad Karet</h2>
            <p>Soustřeďte se na svou otázku a klikněte na tlačítko pro zamíchání a otočení karty.</p>
            
            <div class="card-container">
                <div class="tarot-card" id="tarotCard" onclick="flipCard()">
                    <div class="card-face card-back">☽ 🔮 ☾</div>
                    <div class="card-face card-front">
                        <div class="card-title" id="cardName">Karta</div>
                        <div class="card-meaning" id="cardMeaning">Význam se zobrazí po otočení.</div>
                    </div>
                </div>
            </div>

            <button onclick="drawNewCard()">Táhnout novou kartu</button>
        </div>
    </div>

    <script>
        let currentData = null;

        async function drawNewCard() {
            const cardElement = document.getElementById('tarotCard');
            cardElement.classList.remove('flipped');
            
            const res = await fetch('/api/draw-card');
            currentData = await res.json();

            setTimeout(() => {
                document.getElementById('cardName').innerText = currentData.name;
                document.getElementById('cardMeaning').innerText = currentData.meaning;
                cardElement.classList.add('flipped');
            }, 400);
        }

        function flipCard() {
            if(!currentData) {
                drawNewCard();
            } else {
                document.getElementById('tarotCard').classList.toggle('flipped');
            }
        }
    </script>
</body>
</html>
